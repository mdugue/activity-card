version: 2
updates:
  # bun.lock + package.json — Dependabot reads npm-style manifests regardless
  # of which install tool the project uses.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: [next, "@next/*"]
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      tailwind:
        patterns: [tailwindcss, "@tailwindcss/*", tw-animate-css]
      shadcn:
        patterns: [shadcn, "@base-ui/*"]
      # The whole lint/format toolchain moves together: oxlint and oxfmt are
      # versioned in lockstep by Ultracite's peer ranges, and oxlint-tsgolint
      # tracks the TypeScript release the type-aware rules compile against.
      lint-and-format:
        patterns: [oxlint, "@oxlint/*", oxfmt, ultracite]
      typescript:
        patterns: [typescript, oxlint-tsgolint]
      storybook:
        patterns: [storybook, "@storybook/*", "@chromatic-com/storybook"]
      remotion:
        patterns: [remotion, "@remotion/*"]
      playwright:
        patterns: ["@playwright/*"]
      types:
        patterns: ["@types/*"]
        exclude-patterns: ["@types/react*"]

  # Keep Actions and the `oven-sh/setup-bun` pin fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
