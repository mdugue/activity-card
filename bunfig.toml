# Bun's integrated test runner.
#
# Unit tests live colocated next to the code they cover (e.g. `lib/foo.test.ts`,
# `theme/core/colors.test.ts`) and use the `bun:test` API. Playwright e2e specs
# (`e2e/*.spec.ts`) are a separate runner — unit tests are scoped to source roots
# via the `test` script in package.json (`bun run test`, scoped to `./lib` +
# `./theme`) so the two never clash. Keep that scoping in sync if unit tests ever
# live outside `lib/` or `theme/`.
[test]
# Don't count the test files themselves toward coverage numbers.
coverageSkipTestFiles = true
